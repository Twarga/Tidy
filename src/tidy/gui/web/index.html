<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIDY</title>
<style>
  @font-face {
    font-family: 'VT323'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/vt323.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Press Start 2P'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/pressstart2p.woff2') format('woff2');
  }

  /* ===== theme variables (same 5 palettes as themes.py) ===== */
  :root[data-theme="neon"]      { --bg:#150a2e; --panel:#1d1244; --panel2:#2a1a5e; --border:#21f3d9; --accent:#ff4fd8; --accent2:#21d0ff; --text:#f6f2ff; --muted:#b9aee6; --ok:#21f371; --warn:#ffc93c; --bad:#ff5c7a; }
  :root[data-theme="crt"]       { --bg:#04070a; --panel:#0a1216; --panel2:#0f1e1e; --border:#2bffb0; --accent:#7dff8a; --accent2:#e0ff5e; --text:#c6ffd9; --muted:#5fbf8f; --ok:#3dff7a; --warn:#ffd166; --bad:#ff6b6b; }
  :root[data-theme="gameboy"]   { --bg:#aebcba; --panel:#cfd8d5; --panel2:#e3ebe8; --border:#0f380f; --accent:#9bbc0f; --accent2:#5d7a1f; --text:#1f3a12; --muted:#57723f; --ok:#0f380f; --warn:#9bbc0f; --bad:#7a1212; }
  :root[data-theme="watermelon"]{ --bg:#ff3d5a; --panel:#ffe9f0; --panel2:#fff4f8; --border:#ff2d55; --accent:#2b8c3e; --accent2:#1e6d31; --text:#3a1020; --muted:#a04a62; --ok:#2fb25a; --warn:#ff9f1c; --bad:#ff2d55; }
  :root[data-theme="paper"]     { --bg:#efe7d4; --panel:#f6f1e3; --panel2:#fffdf5; --border:#5a4a36; --accent:#c1440e; --accent2:#47597e; --text:#3a342a; --muted:#8a7f6b; --ok:#4a7b3a; --warn:#c98a2b; --bad:#c1440e; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'VT323', monospace;
    font-size: 19px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ================= TOP TOOLBAR ================= */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 3px solid var(--border);
    flex: none;
  }
  .hud { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--accent); letter-spacing: 1px; }
  .toolbar .right { display: flex; align-items: center; gap: 12px; }
  .statusline { font-size: 17px; color: var(--muted); }
  .statusline b.okc { color: var(--ok); }
  .statusline b.badc { color: var(--bad); }

  /* theme dots */
  .dot-btn { width: 22px; height: 22px; border: 2px solid var(--muted); cursor: pointer; }
  .dot-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }

  /* ================= WORKSPACE (sidebar | main / log) ================= */
  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 250px 1fr;
    grid-template-rows: 1fr auto;
    min-height: 0;
  }

  /* ---- left sidebar ---- */
  .sidebar {
    grid-row: 1;
    border-right: 3px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px;
    min-height: 0;
  }
  .side-head {
    font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--accent2);
    margin: 4px 2px 10px; letter-spacing: 1px;
  }
  .repo-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; margin-bottom: 6px;
    border: 2px solid transparent; cursor: pointer;
    background: var(--panel2);
  }
  .repo-item:hover { border-color: var(--border); }
  .repo-item.active { border-color: var(--accent); background: var(--bg); }
  .r-dot { width: 12px; height: 12px; flex: none; border: 2px solid var(--panel); }
  .r-dot.ok { background: var(--ok); }
  .r-dot.warn { background: var(--warn); }
  .r-dot.err { background: var(--bad); }
  .r-name { flex: 1; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-x { color: var(--bad); font-size: 16px; cursor: pointer; padding: 0 2px; }
  .r-x:hover { background: var(--panel); }
  .btn-add { width: 100%; margin-top: 10px; }

  /* ---- main detail panel ---- */
  .main { grid-row: 1; grid-column: 2; padding: 18px 22px; overflow-y: auto; min-height: 0; }
  .banner {
    display: flex; gap: 14px; align-items: center;
    background: var(--panel); border: 2px solid var(--border);
    padding: 12px 16px; margin-bottom: 18px;
  }
  .banner .dot {
    width: 14px; height: 14px; background: var(--ok);
    border: 2px solid var(--text); animation: blink 1.4s steps(2) infinite; flex: none;
  }
  @keyframes blink { 50% { opacity: .25; } }
  .bt { font-size: 22px; color: var(--ok); line-height: 1.2; }
  .bs { font-size: 16px; color: var(--muted); }
  .repoid { font-family: 'Press Start 2P', monospace; font-size: 14px; color: var(--accent); }
  .repopath { font-size: 17px; color: var(--muted); margin: 8px 0 4px; word-break: break-all; }
  .badges { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge {
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    border: 1px solid var(--accent2); color: var(--accent2); padding: 4px 8px;
  }
  .badge.okc { border-color: var(--ok); color: var(--ok); }
  .badge.badc { border-color: var(--bad); color: var(--bad); }

  .card-head {
    font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--accent2);
    border-bottom: 2px dashed var(--panel2); padding: 2px 2px 8px;
    margin: 20px 0 12px; letter-spacing: 1px;
  }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip {
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    border: 1px solid var(--accent2); color: var(--accent2);
    padding: 6px 8px; cursor: pointer;
  }
  .chip:hover { background: var(--panel); }
  .chip .x { color: var(--bad); margin-right: 5px; }
  input.time {
    font-family: 'VT323', monospace; font-size: 19px; width: 120px;
    background: var(--bg); color: var(--accent); border: 2px solid var(--border);
    padding: 5px 8px; text-align: center;
  }

  .btn {
    font-family: 'VT323', monospace; font-size: 21px;
    background: var(--panel2); color: var(--text);
    border: 2px solid var(--border); padding: 8px 16px; cursor: pointer;
    box-shadow: 0 3px 0 #00000066;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  .btn.pri { background: var(--accent); color: var(--bg); border-color: var(--text); }
  .btn.small { font-size: 18px; padding: 6px 12px; }
  .btnbar { display: flex; gap: 10px; flex-wrap: wrap; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 4px 0 6px; }
  .stat { background: var(--panel); border: 2px solid var(--border); padding: 12px; text-align: center; }
  .stat .n { font-size: 24px; color: var(--accent); }
  .stat .c { font-size: 14px; color: var(--muted); }

  .empty { color: var(--muted); text-align: center; padding: 26px 0; font-size: 20px; }

  /* ---- bottom activity log strip ---- */
  .logwrap {
    grid-column: 1 / -1; grid-row: 2;
    border-top: 3px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
    height: 160px; flex: none;
  }
  .log-head {
    font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--accent2);
    padding: 8px 14px; border-bottom: 2px dashed var(--panel2);
  }
  .log { flex: 1; overflow-y: auto; padding: 8px 14px; font-size: 17px; line-height: 1.6; color: var(--muted); }
  .log .ok { color: var(--ok); }
  .log .er { color: var(--bad); }
  .log .wa { color: var(--warn); }
  .log .ts { color: var(--muted); opacity: .75; }

  /* toast */
  .toast {
    position: fixed; bottom: 190px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 2px solid var(--border); color: var(--text);
    padding: 10px 18px; font-size: 19px; display: none; z-index: 50;
    box-shadow: 4px 4px 0 #00000055;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="hud">▓ TIDY</div>
    <div class="right">
      <span class="statusline" id="statusLine">—</span>
      <div id="themeDots" style="display:flex;gap:6px"></div>
      <button class="btn small" id="btnPullAll">PULL ALL</button>
      <button class="btn small pri" id="btnBackupAll">BACKUP ALL</button>
    </div>
  </div>

  <div class="workspace">
    <div class="sidebar">
      <div class="side-head">◈ REPOS</div>
      <div id="repolist"></div>
      <button class="btn btn-add" id="btnAddRepo">＋ ADD REPO…</button>
    </div>

    <div class="main" id="main">
      <div id="detail"></div>
    </div>

    <div class="logwrap">
      <div class="log-head">▨ ACTIVITY LOG</div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
